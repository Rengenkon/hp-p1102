name: hp-docker
services:
  hplip:
    container_name: hp-p1102-${PRINTER_MODE:-local}
    image: ${PRINTER_IMAGE:?Run python3 scripts/printer.py deploy}
    restart: unless-stopped
    environment:
      HP_PRINTER_GID: ${HP_PRINTER_GID:?Run python3 scripts/printer.py deploy}
      PRINTER_MODE: ${PRINTER_MODE:-local}
    ports:
      - '${PRINTER_BIND:-127.0.0.1}:${PRINTER_PORT:-8631}:${PRINTER_CONTAINER_PORT:-631}'
    volumes:
      - cups-config:/etc/cups
      - cups-spool:/var/spool/cups
      - /dev/bus/usb:/dev/bus/usb
      - ./.state/runtime:/etc/printer:ro
    device_cgroup_rules:
      - 'c 189:* rw'
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/entrypoint.py", "--check"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  cups-config:
  cups-spool:
