LogLevel warn
Listen 0.0.0.0:631
Listen /run/cups/cups.sock
Browsing Off
WebInterface No
ServerAlias *
DefaultAuthType Basic
<Location />
  Order allow,deny
  Allow all
</Location>
<Location /admin>
  Order allow,deny
  Allow localhost
</Location>
<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow localhost
</Location>
<Policy default>
  <Limit Create-Job Print-Job Print-URI Send-Document Send-URI Validate-Job Get-Printer-Attributes Get-Jobs Get-Job-Attributes Cancel-Job CUPS-Get-Printers CUPS-Get-Classes CUPS-Get-Default>
    Order allow,deny
    Allow all
  </Limit>
  <Limit All>
    AuthType Default
    Require user @SYSTEM
    Order allow,deny
    Allow localhost
  </Limit>
</Policy>
