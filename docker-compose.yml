services:
  hplip:
    build: .
    container_name: hplip
    restart: unless-stopped

    ports:
      - "127.0.0.1:8631:631"

    volumes:
      - cups-config:/etc/cups
      - cups-spool:/var/spool/cups
      - /dev/bus/usb:/dev/bus/usb:ro

    device_cgroup_rules:
      - 'c 189:* rw'

volumes:
  cups-config:
  cups-spool:
